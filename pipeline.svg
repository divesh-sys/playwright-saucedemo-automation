<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img" aria-label="Pipeline flow from git push to test report">
  <style>
    text { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .bg    { fill: #0b1220; }
    .head  { fill: #f8fafc; font-size: 22px; font-weight: 700; }
    .hint  { fill: #94a3b8; font-size: 13px; }
    .node  { fill: #0f172a; stroke: #334155; stroke-width: 2; animation: glow 6s linear infinite; }
    .nt    { fill: #f8fafc; font-size: 17px; font-weight: 700; }
    .ns    { fill: #94a3b8; font-size: 12.5px; }
    .link  { stroke: #475569; stroke-width: 2.5; stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
    .chip  { fill: #1e293b; stroke: #334155; }
    .ct    { fill: #cbd5e1; font-size: 12px; font-weight: 600; }
    @keyframes glow {
      0%   { stroke: #334155; fill: #0f172a; }
      5%   { stroke: #2dd4bf; fill: #0f3d3a; }
      20%  { stroke: #2dd4bf; fill: #0f3d3a; }
      32%, 100% { stroke: #334155; fill: #0f172a; }
    }
    @keyframes flow { to { stroke-dashoffset: -12; } }
  </style>

  <rect class="bg" width="1000" height="270" rx="16"/>
  <text class="head" x="30" y="44">From git push to test report</text>
  <text class="hint" x="30" y="66">The same project runs on two pipelines: GitHub Actions (cloud) and Jenkins (your own server)</text>

  <!-- connectors -->
  <line class="link" x1="150" y1="145" x2="190" y2="145"/>
  <line class="link" x1="315" y1="145" x2="355" y2="145"/>
  <line class="link" x1="480" y1="145" x2="520" y2="145"/>
  <line class="link" x1="645" y1="145" x2="685" y2="145"/>
  <line class="link" x1="810" y1="145" x2="850" y2="145"/>

  <!-- nodes -->
  <rect class="node" x="25"  y="110" width="125" height="70" rx="12" style="animation-delay:0.19s"/>
  <text class="nt" x="87.5"  y="141" text-anchor="middle">Push</text>
  <text class="ns" x="87.5"  y="161" text-anchor="middle">git push</text>

  <rect class="node" x="190" y="110" width="125" height="70" rx="12" style="animation-delay:1.24s"/>
  <text class="nt" x="252.5" y="141" text-anchor="middle">GitHub</text>
  <text class="ns" x="252.5" y="161" text-anchor="middle">your repo</text>

  <rect class="node" x="355" y="110" width="125" height="70" rx="12" style="animation-delay:2.28s"/>
  <text class="nt" x="417.5" y="141" text-anchor="middle">Lint</text>
  <text class="ns" x="417.5" y="161" text-anchor="middle">Ruff checks code</text>

  <rect class="node" x="520" y="110" width="125" height="70" rx="12" style="animation-delay:3.32s"/>
  <text class="nt" x="582.5" y="141" text-anchor="middle">Test</text>
  <text class="ns" x="582.5" y="161" text-anchor="middle">3 browsers</text>

  <rect class="node" x="685" y="110" width="125" height="70" rx="12" style="animation-delay:4.36s"/>
  <text class="nt" x="747.5" y="141" text-anchor="middle">Report</text>
  <text class="ns" x="747.5" y="161" text-anchor="middle">Allure + JUnit</text>

  <rect class="node" x="850" y="110" width="125" height="70" rx="12" style="animation-delay:5.41s"/>
  <text class="nt" x="912.5" y="141" text-anchor="middle">Result</text>
  <text class="ns" x="912.5" y="161" text-anchor="middle">pass or fail</text>

  <!-- moving packet -->
  <path id="route" d="M25 145 H975" fill="none"/>
  <circle r="7" fill="#34d399">
    <animateMotion dur="6s" repeatCount="indefinite"><mpath href="#route"/></animateMotion>
  </circle>
  <circle r="14" fill="#34d399" fill-opacity="0.25">
    <animateMotion dur="6s" repeatCount="indefinite"><mpath href="#route"/></animateMotion>
  </circle>

  <!-- tool chips -->
  <rect class="chip" x="190" y="205" width="125" height="28" rx="14"/>
  <text class="ct" x="252.5" y="224" text-anchor="middle">Actions or Jenkins</text>
  <rect class="chip" x="355" y="205" width="125" height="28" rx="14"/>
  <text class="ct" x="417.5" y="224" text-anchor="middle">ruff check .</text>
  <rect class="chip" x="520" y="205" width="125" height="28" rx="14"/>
  <text class="ct" x="582.5" y="224" text-anchor="middle">pytest</text>
  <rect class="chip" x="685" y="205" width="125" height="28" rx="14"/>
  <text class="ct" x="747.5" y="224" text-anchor="middle">Pages / artifacts</text>
  <rect class="chip" x="850" y="205" width="125" height="28" rx="14"/>
  <text class="ct" x="912.5" y="224" text-anchor="middle">blue or red</text>
</svg>
