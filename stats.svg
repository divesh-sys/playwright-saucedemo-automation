<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="1000" height="130" role="img" aria-label="Project statistics">
  <style>
    text { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .card { fill: #0f172a; stroke: #1e293b; stroke-width: 1.5; }
    .num  { font-size: 44px; font-weight: 800; }
    .lab  { fill: #94a3b8; font-size: 14px; letter-spacing: 0.5px; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .c1 { animation: rise 0.7s ease-out 0.0s both; }
    .c2 { animation: rise 0.7s ease-out 0.2s both; }
    .c3 { animation: rise 0.7s ease-out 0.4s both; }
    .c4 { animation: rise 0.7s ease-out 0.6s both; }
  </style>
  <g class="c1">
    <rect class="card" x="0" y="5" width="232" height="120" rx="14"/>
    <text class="num" x="116" y="70" text-anchor="middle" fill="#38bdf8">14</text>
    <text class="lab" x="116" y="100" text-anchor="middle">AUTOMATED TESTS</text>
  </g>
  <g class="c2">
    <rect class="card" x="256" y="5" width="232" height="120" rx="14"/>
    <text class="num" x="372" y="70" text-anchor="middle" fill="#34d399">3</text>
    <text class="lab" x="372" y="100" text-anchor="middle">BROWSERS</text>
  </g>
  <g class="c3">
    <rect class="card" x="512" y="5" width="232" height="120" rx="14"/>
    <text class="num" x="628" y="70" text-anchor="middle" fill="#fbbf24">42</text>
    <text class="lab" x="628" y="100" text-anchor="middle">TEST RUNS PER BUILD</text>
  </g>
  <g class="c4">
    <rect class="card" x="768" y="5" width="232" height="120" rx="14"/>
    <text class="num" x="884" y="70" text-anchor="middle" fill="#a78bfa">2</text>
    <text class="lab" x="884" y="100" text-anchor="middle">CI/CD TOOLS</text>
  </g>
</svg>
