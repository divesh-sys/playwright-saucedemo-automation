[pytest]
base_url = https://www.saucedemo.com
addopts =
    -v
    --html=reports/report.html
    --self-contained-html
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --output=test-results
markers =
    smoke: quick sanity checks
    regression: full regression suite
testpaths = tests
