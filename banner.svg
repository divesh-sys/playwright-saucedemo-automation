<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Playwright Python Test Automation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#12306b"/>
      <stop offset="1" stop-color="#0d7a6f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <clipPath id="typed">
      <rect x="60" y="148" height="40" width="880">
        <animate attributeName="width" values="0;0;880" keyTimes="0;0.2;1" dur="4.5s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { fill: #ffffff; font-size: 36px; font-weight: 700; animation: up 1s ease-out both; }
    .tag   { fill: #7dd3fc; font-size: 15px; letter-spacing: 3px; font-weight: 600; animation: up 1s ease-out 0.2s both; }
    .sub   { fill: #e2e8f0; font-size: 22px; }
    .pill  { fill: #ffffff; fill-opacity: 0.12; stroke: #ffffff; stroke-opacity: 0.25; }
    .pt    { fill: #f8fafc; font-size: 14px; font-weight: 600; }
    .lbl   { fill: #cbd5e1; font-size: 13px; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pop { from { opacity: 0; } to { opacity: 1; } }
    .p1 { animation: pop 0.8s ease-out 1.2s both; }
    .p2 { animation: pop 0.8s ease-out 1.5s both; }
    .p3 { animation: pop 0.8s ease-out 1.8s both; }
  </style>

  <rect width="1000" height="280" rx="16" fill="url(#bg)"/>

  <!-- floating light circles -->
  <circle cx="780" cy="230" r="90" fill="#ffffff" fill-opacity="0.05">
    <animateTransform attributeName="transform" type="translate" values="0 0; -30 -14; 0 0" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="930" cy="40" r="60" fill="#38bdf8" fill-opacity="0.10">
    <animateTransform attributeName="transform" type="translate" values="0 0; -24 18; 0 0" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="420" cy="270" r="70" fill="#34d399" fill-opacity="0.07">
    <animateTransform attributeName="transform" type="translate" values="0 0; 28 -10; 0 0" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- check mark badge -->
  <circle cx="912" cy="86" r="38" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-dasharray="239" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="239;239;0" keyTimes="0;0.15;1" dur="3s" fill="freeze"/>
  </circle>
  <path d="M893 88 L906 101 L932 71" fill="none" stroke="#34d399" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="70" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="70;70;0" keyTimes="0;0.55;1" dur="3.6s" fill="freeze"/>
  </path>

  <text class="tag" x="60" y="62">UI TEST AUTOMATION</text>
  <text class="title" x="60" y="112">Playwright Python Test Automation</text>

  <g clip-path="url(#typed)">
    <text class="sub" x="60" y="176">Page Object Model  •  pytest  •  GitHub Actions  •  Jenkins  •  Allure</text>
  </g>

  <!-- browser pills -->
  <g class="p1">
    <rect class="pill" x="60" y="196" width="128" height="30" rx="15"/>
    <circle cx="80" cy="211" r="5" fill="#34d399"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <text class="pt" x="95" y="216">Chromium</text>
  </g>
  <g class="p2">
    <rect class="pill" x="200" y="196" width="116" height="30" rx="15"/>
    <circle cx="220" cy="211" r="5" fill="#34d399"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" begin="0.3s" repeatCount="indefinite"/></circle>
    <text class="pt" x="235" y="216">Firefox</text>
  </g>
  <g class="p3">
    <rect class="pill" x="328" y="196" width="112" height="30" rx="15"/>
    <circle cx="348" cy="211" r="5" fill="#34d399"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></circle>
    <text class="pt" x="363" y="216">WebKit</text>
  </g>

  <!-- progress bar -->
  <text class="lbl" x="60" y="248">14 tests × 3 browsers = 42 test runs per pipeline run</text>
  <rect x="60" y="256" width="880" height="8" rx="4" fill="#ffffff" fill-opacity="0.15"/>
  <rect x="60" y="256" width="880" height="8" rx="4" fill="url(#bar)">
    <animate attributeName="width" values="0;0;880" keyTimes="0;0.2;1" dur="4.5s" fill="freeze"/>
  </rect>
</svg>
